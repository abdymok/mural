<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kyiv — balcony view</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  body{display:grid;place-items:center}
  img{display:block;width:100vw;height:100dvh;object-fit:cover}
  .rotate{display:none;color:#fff;font:14px/1.4 Georgia,serif;letter-spacing:.04em;text-align:center;padding:24px}
  @media (orientation:portrait){
    img{display:none}
    .rotate{display:block}
  }
</style>
</head>
<body>
<img src="kyiv-balcony.jpg" alt="Panoramic view of Kyiv from a balcony">
<div class="rotate">Please turn your phone sideways to view the panorama.</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ukraine@war — living wall</title>

  <style>
    :root {
      --paper: #f3f1eb;
      --ink: #111;
      --line: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* --------------------------------------------------
       PAGE
    -------------------------------------------------- */

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* --------------------------------------------------
       HEADER
    -------------------------------------------------- */

    .masthead {
      position: absolute;
      z-index: 100;
      top: 24px;
      left: 24px;
      pointer-events: none;
    }

    .title {
      margin: 0;
      font-size: clamp(30px, 3vw, 52px);
      line-height: 0.9;
      font-weight: normal;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin-top: 10px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* --------------------------------------------------
       CREDIT
    -------------------------------------------------- */

    .credit {
      position: absolute;
      z-index: 100;
      top: 24px;
      right: 24px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;

      writing-mode: vertical-rl;
      transform: rotate(180deg);

      pointer-events: none;
    }

    /* --------------------------------------------------
       IMAGE WALL
    -------------------------------------------------- */

    .wall {
      position: absolute;

      /*
        Leave space for the masthead above and controls
        below. This is what prevents the images from
        covering the title.
      */
      top: 82px;
      right: 24px;
      bottom: 94px;
      left: 24px;

      display: grid;

      /*
        10 columns × 7 rows = 70 positions.
        67 images means 3 positions remain empty.
      */
      grid-template-columns: repeat(10, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));

      gap: 5px;

      z-index: 10;
    }

    .tile {
      position: relative;
      min-width: 0;
      min-height: 0;

      overflow: hidden;
      background: #ddd;

      opacity: 0;

      transform:
        translate3d(
          var(--x, 0px),
          var(--y, 0px),
          0
        )
        rotate(var(--r, 0deg))
        scale(var(--s, 1));

      transition:
        opacity 1.4s ease,
        transform 7s cubic-bezier(.2, .7, .2, 1);

      will-change: transform, opacity;
    }

    .tile.visible {
      opacity: 1;
    }

    .tile img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      user-select: none;
      -webkit-user-drag: none;

      /*
        Slightly reduce the harshness of the images
        against the paper background.
      */
      filter: contrast(0.98);
    }

    /* Empty slots */
    .empty {
      background: transparent;
    }

    /* --------------------------------------------------
       FOOTER
    -------------------------------------------------- */

    .footer-left {
      position: absolute;
      z-index: 100;

      left: 24px;
      bottom: 24px;
    }

    .footer-label {
      margin-bottom: 7px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .subscribe {
      display: inline-block;

      color: var(--ink);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.2;

      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
    }

    .subscribe:hover {
      border-bottom-color: var(--ink);
    }

    .footer-right {
      position: absolute;
      z-index: 100;

      right: 24px;
      bottom: 25px;

      display: flex;
      align-items: center;
      gap: 20px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .counter-line {
      width: 20px;
      height: 1px;
      background: var(--line);
    }

    button {
      appearance: none;
      border: 0;
      padding: 0;
      margin: 0;

      background: transparent;
      color: var(--ink);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.55;
    }

    /* --------------------------------------------------
       INTRO
    -------------------------------------------------- */

    .intro {
      position: fixed;
      z-index: 1000;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--paper);

      pointer-events: none;

      animation: introOut 1.1s ease 1.1s forwards;
    }

    .intro-text {
      font-size: clamp(34px, 6vw, 90px);
      letter-spacing: -0.055em;
      opacity: 0;

      animation:
        introIn 0.8s ease 0.15s forwards,
        introTextOut 0.7s ease 0.8s forwards;
    }

    @keyframes introIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes introTextOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes introOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* --------------------------------------------------
       MOBILE
    -------------------------------------------------- */

    @media (max-width: 700px) {

      .masthead {
        top: 16px;
        left: 16px;
      }

      .title {
        font-size: 30px;
      }

      .subtitle {
        margin-top: 7px;
        font-size: 8px;
      }

      .credit {
        top: 16px;
        right: 16px;
        font-size: 8px;
      }

      .wall {
        top: 70px;
        right: 12px;
        bottom: 88px;
        left: 12px;

        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(14, minmax(0, 1fr));

        gap: 3px;
      }

      .footer-left {
        left: 16px;
        bottom: 17px;
      }

      .footer-right {
        right: 16px;
        bottom: 18px;
        gap: 12px;
      }

      .subscribe {
        font-size: 12px;
      }
    }

    /* --------------------------------------------------
       REDUCED MOTION
    -------------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .tile {
        transition: opacity 0.3s ease;
        transform: none !important;
      }

      .intro,
      .intro-text {
        animation: none;
      }

      .intro {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- INTRO -->
    <div class="intro" aria-hidden="true">
      <div class="intro-text">ukraine@war</div>
    </div>

    <!-- HEADER -->
    <header class="masthead">
      <h1 class="title">ukraine@war</h1>
      <div class="subtitle">67 images / living wall</div>
    </header>

    <!-- CREDIT -->
    <div class="credit">
      drone dept. / 2026
    </div>

    <!-- IMAGE WALL -->
    <main class="wall" id="wall" aria-label="Ukraine at war — living wall">
    </main>

    <!-- FOOTER LEFT -->
    <div class="footer-left">
      <div class="footer-label">
        The Daily Dispatch
      </div>

      <a
        class="subscribe"
        href="https://abdymok.substack.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read &amp; subscribe on Substack →
      </a>
    </div>

    <!-- FOOTER RIGHT -->
    <div class="footer-right">

      <div class="counter">
        <span id="counter">00</span>
        <span class="counter-line"></span>
      </div>

      <button id="recompose" type="button">
        Recompose
      </button>

      <button id="pause" type="button">
        Pause
      </button>

    </div>

  </div>


  <script>
    /* ==================================================
       IMAGE LIST

       These are the ACTUAL filenames in your repository:

       1.jfif
       2.jfif
       3.jfif
       4.jfif
       5.jfif
       6.jfif
       7.jpg ... 67.jpg
    ================================================== */

    const files = [
      "1.jfif",
      "2.jfif",
      "3.jfif",
      "4.jfif",
      "5.jfif",
      "6.jfif"
    ];

    for (let i = 7; i <= 67; i++) {
      files.push(`${i}.jpg`);
    }


    /* ==================================================
       SETTINGS
    ================================================== */

    const wall = document.getElementById("wall");
    const counter = document.getElementById("counter");
    const recomposeButton = document.getElementById("recompose");
    const pauseButton = document.getElementById("pause");

    const TOTAL_SLOTS = 70;
    const TOTAL_IMAGES = files.length;

    let tiles = [];
    let paused = false;
    let cycle = 0;


    /* ==================================================
       HELPERS
    ================================================== */

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }


    /* ==================================================
       CREATE WALL
    ================================================== */

    function createWall() {

      wall.innerHTML = "";
      tiles = [];

      /*
        70 grid slots.
        First 67 receive images.
        Last 3 remain empty.
      */

      const order = shuffle(
        Array.from(
          { length: TOTAL_SLOTS },
          (_, i) => i
        )
      );

      const imageSlots = order.slice(0, TOTAL_IMAGES);

      files.forEach((file, index) => {

        const tile = document.createElement("div");
        tile.className = "tile";

        const img = document.createElement("img");

        img.src = file;
        img.alt = `Ukraine at war — image ${index + 1}`;
        img.loading = index < 12 ? "eager" : "lazy";
        img.decoding = "async";

        /*
          If an image cannot load, hide the broken tile
          instead of displaying a broken-image icon.
        */
        img.addEventListener("error", () => {
          tile.style.display = "none";
        });

        tile.appendChild(img);

        /*
          Place image into a randomly selected grid slot.
        */
        tile.style.gridColumn =
          (imageSlots[index] % 10) + 1;

        tile.style.gridRow =
          Math.floor(imageSlots[index] / 10) + 1;

        /*
          Very subtle initial variation.
        */
        tile.style.setProperty(
          "--x",
          `${random(-3, 3).toFixed(1)}px`
        );

        tile.style.setProperty(
          "--y",
          `${random(-3, 3).toFixed(1)}px`
        );

        tile.style.setProperty(
          "--r",
          `${random(-0.7, 0.7).toFixed(2)}deg`
        );

        tile.style.setProperty(
          "--s",
          random(0.99, 1.01).toFixed(3)
        );

        wall.appendChild(tile);
        tiles.push(tile);

      });


      /*
        Fade the wall in after the DOM has been created.
      */
      requestAnimationFrame(() => {

        tiles.forEach((tile, index) => {

          setTimeout(() => {
            tile.classList.add("visible");
          }, index * 22);

        });

      });

      updateCounter();
    }


    /* ==================================================
       RECOMPOSE

       Instead of moving images through complicated
       absolute positioning, we simply redistribute the
       67 tiles through the 70 available grid positions.

       This is much more reliable on GitHub Pages.
    ================================================== */

    function recompose() {

      if (paused || tiles.length === 0) {
        return;
      }

      cycle++;

      const positions = shuffle(
        Array.from(
          { length: TOTAL_SLOTS },
          (_, i) => i
        )
      );

      /*
        Only 67 of the 70 positions are used.
      */

      tiles.forEach((tile, index) => {

        const position = positions[index];

        tile.style.gridColumn =
          (position % 10) + 1;

        tile.style.gridRow =
          Math.floor(position / 10) + 1;

        /*
          Subtle movement makes the composition feel alive
          without throwing the images across the screen.
        */

        tile.style.setProperty(
          "--x",
          `${random(-5, 5).toFixed(1)}px`
        );

        tile.style.setProperty(
          "--y",
          `${random(-5, 5).toFixed(1)}px`
        );

        tile.style.setProperty(
          "--r",
          `${random(-1.2, 1.2).toFixed(2)}deg`
        );

        tile.style.setProperty(
          "--s",
          random(0.985, 1.015).toFixed(3)
        );

      });

      updateCounter();
    }


    /* ==================================================
       COUNTER
    ================================================== */

    function updateCounter() {

      const number =
        String((cycle + 1) % 100).padStart(2, "0");

      counter.textContent = number;
    }


    /* ==================================================
       PAUSE
    ================================================== */

    function togglePause() {

      paused = !paused;

      pauseButton.textContent =
        paused ? "Play" : "Pause";

    }


    /* ==================================================
       BUTTONS
    ================================================== */

    recomposeButton.addEventListener(
      "click",
      () => {

        /*
          Allow RECOMPOSE to work even when the automatic
          animation is paused.
        */

        const wasPaused = paused;

        paused = false;
        recompose();

        paused = wasPaused;

      }
    );

    pauseButton.addEventListener(
      "click",
      togglePause
    );


    /* ==================================================
       AUTOMATIC RECOMPOSITION

       Every 8 seconds.
    ================================================== */

    setInterval(() => {

      if (!paused) {
        recompose();
      }

    }, 8000);


    /* ==================================================
       START
    ================================================== */

    createWall();

  </script>

</body>
</html>

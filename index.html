<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f1eb">
<meta name="description" content="ukraine@war — a daily record of Russia's war in Ukraine.">
<meta property="og:title" content="ukraine@war">
<meta property="og:description" content="A daily record of Russia's war in Ukraine.">
<title>ukraine@war</title>

<style>
:root{
  --paper:#f3f1eb;
  --ink:#0a0a09;
  --gap:3px;
  --cols:10;
  --rows:7;
  --dur:1200ms;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
}

body{
  font-family:Georgia,"Times New Roman",serif;
}

.stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:var(--paper);
}

.wall{
  position:absolute;
  inset:18px;
  overflow:hidden;
}

.tile{
  position:absolute;
  left:0;
  top:0;
  width:calc((100% - (var(--cols) - 1)*var(--gap))/var(--cols));
  height:calc((100% - (var(--rows) - 1)*var(--gap))/var(--rows));
  transition:
    transform var(--dur) cubic-bezier(.2,.75,.2,1),
    opacity var(--dur) ease;
  will-change:transform;
  pointer-events:none;
}

.tile::before{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(0,0,0,.07);
  z-index:5;
  pointer-events:none;
}

.tile img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  transition:
    transform 2.2s cubic-bezier(.2,.7,.2,1),
    filter 1.2s ease,
    opacity .8s ease;
}

.tile .back{
  opacity:0;
  z-index:2;
}

.tile .front{
  opacity:1;
  z-index:1;
}

.tile.change .front{
  opacity:0;
}

.tile.change .back{
  opacity:1;
  transform:scale(1.04);
}


/* Masthead */

.mast{
  position:fixed;
  z-index:30;
  top:25px;
  left:27px;
  pointer-events:none;
  mix-blend-mode:multiply;
}

.mast h1{
  margin:0;
  font-size:clamp(18px,2vw,31px);
  font-weight:400;
  letter-spacing:-.04em;
  line-height:.9;
}

.mast p{
  margin:9px 0 0;
  font:10px/1.2 Arial,sans-serif;
  letter-spacing:.16em;
  text-transform:uppercase;
}


/* Credit */

.mark{
  position:fixed;
  z-index:30;
  right:28px;
  top:25px;
  font:10px/1 Arial,sans-serif;
  letter-spacing:.15em;
  text-transform:uppercase;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  opacity:.72;
}


/* Substack link */

.subscribe{
  position:fixed;
  z-index:35;
  left:27px;
  bottom:24px;
  color:var(--ink);
  text-decoration:none;
  max-width:340px;
}

.subscribe-label{
  display:block;
  margin-bottom:7px;
  font:10px/1 Arial,sans-serif;
  letter-spacing:.13em;
  text-transform:uppercase;
  opacity:.62;
}

.subscribe-title{
  display:inline-block;
  font:16px/1.15 Georgia,"Times New Roman",serif;
  letter-spacing:-.015em;
  border-bottom:1px solid rgba(10,10,9,.55);
  padding-bottom:2px;
  transition:opacity .2s ease;
}

.subscribe:hover .subscribe-title{
  opacity:.58;
}


/* Controls */

.controls{
  position:fixed;
  z-index:40;
  right:26px;
  bottom:23px;
  display:flex;
  gap:8px;
  align-items:center;
}

button{
  border:0;
  background:transparent;
  color:var(--ink);
  font:10px Arial,sans-serif;
  letter-spacing:.13em;
  text-transform:uppercase;
  padding:7px 0;
  cursor:pointer;
}

button:hover{
  opacity:.55;
}

button+button{
  margin-left:14px;
}

.rule{
  width:20px;
  height:1px;
  background:currentColor;
  opacity:.5;
}

.counter{
  font:10px Arial,sans-serif;
  letter-spacing:.11em;
  opacity:.65;
}


/* Intro */

.intro{
  position:fixed;
  z-index:100;
  inset:0;
  background:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  animation:intro 2.1s cubic-bezier(.65,0,.35,1) forwards;
}

.intro span{
  font-size:clamp(30px,7vw,100px);
  letter-spacing:-.065em;
  font-weight:400;
  transform:translateY(10px);
  animation:introtext 1.8s ease forwards;
}

@keyframes intro{
  0%,72%{opacity:1}
  100%{opacity:0;visibility:hidden}
}

@keyframes introtext{
  0%{
    opacity:0;
    transform:translateY(20px);
  }
  35%{
    opacity:1;
    transform:translateY(0);
  }
  72%{
    opacity:1;
  }
  100%{
    opacity:0;
  }
}


/* Mobile */

@media(max-width:800px){

  .wall{
    inset:12px;
  }

  .mast{
    top:18px;
    left:18px;
  }

  .mark{
    right:18px;
    top:18px;
  }

  .subscribe{
    left:18px;
    bottom:17px;
  }

  .subscribe-title{
    font-size:15px;
  }

  .controls{
    right:18px;
    bottom:15px;
  }

  .tile{
    width:calc((100% - (var(--cols) - 1)*2px)/var(--cols));
    height:calc((100% - (var(--rows) - 1)*2px)/var(--rows));
  }
}


/* Reduced motion */

@media(prefers-reduced-motion:reduce){

  .intro{
    display:none;
  }

  .tile{
    transition:none;
  }

  .tile img{
    transition:none;
  }
}
</style>
</head>

<body>

<div class="stage">

  <div
    class="wall"
    id="wall"
    aria-label="A living wall of 67 images">
  </div>

  <div class="mast">
    <h1>ukraine@war</h1>
    <p>67 images / living wall</p>
  </div>

  <div class="mark">
    drone dept. / 2026
  </div>

  <a
    class="subscribe"
    href="https://abdymok.substack.com/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Read and subscribe to ukraine@war on Substack">

    <span class="subscribe-label">
      The daily dispatch
    </span>

    <span class="subscribe-title">
      Read &amp; subscribe on Substack →
    </span>

  </a>

  <div class="controls">
    <span class="counter" id="counter">01</span>
    <span class="rule"></span>
    <button id="shuffle">recompose</button>
    <button id="pause">pause</button>
  </div>

</div>

<div class="intro">
  <span>ukraine@war</span>
</div>


<script>

/*
  IMPORTANT:
  The existing repository has the 67 JPG files
  alongside index.html, so image paths are simply:

  1.jpg
  2.jpg
  ...
  67.jpg
*/

const files = Array.from(
  {length:67},
  (_,i) => `${i+1}.jpg`
);

const wall =
  document.getElementById("wall");

const counter =
  document.getElementById("counter");

const pauseBtn =
  document.getElementById("pause");

const shuffleBtn =
  document.getElementById("shuffle");

const N = files.length;
const SLOTS = 70;
const COLS = 10;
const ROWS = 7;

let tiles = [];
let slotOf = [];
let occupied = [];
let cycle = 0;
let paused = false;
let timer;


/* Position a tile */

function xy(slot){

  const c = slot % COLS;
  const r = Math.floor(slot / COLS);

  return {
    x:`calc(${c} * ((100% - ${(COLS-1)}*var(--gap)) / ${COLS} + var(--gap))`,
    y:`calc(${r} * ((100% - ${(ROWS-1)}*var(--gap)) / ${ROWS} + var(--gap))`
  };
}


function place(el,slot){

  const p = xy(slot);

  el.style.transform =
    `translate(${p.x},${p.y})`;
}


/* Create a photograph tile */

function make(i){

  const tile =
    document.createElement("figure");

  tile.className = "tile";

  const front =
    document.createElement("img");

  const back =
    document.createElement("img");

  front.className = "front";
  back.className = "back";

  front.alt = "";
  back.alt = "";

  front.loading =
    i < 20 ? "eager" : "lazy";

  front.src =
    files[i];

  tile.append(front,back);

  wall.append(tile);

  return tile;
}


/* Random initial positions */

function sampleSlots(){

  const slots =
    Array.from(
      {length:SLOTS},
      (_,i)=>i
    );

  for(
    let i=slots.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      slots[i],
      slots[j]
    ]=[
      slots[j],
      slots[i]
    ];
  }

  return slots.slice(0,N);
}


/* Initial wall */

function initial(){

  occupied =
    sampleSlots();

  tiles =
    files.map((_,i)=>make(i));

  tiles.forEach((tile,i)=>{

    slotOf[i] =
      occupied[i];

    place(
      tile,
      slotOf[i]
    );

  });
}


/* Empty positions */

function freeSlots(){

  const used =
    new Set(slotOf);

  return Array.from(
    {length:SLOTS},
    (_,i)=>i
  ).filter(
    i=>!used.has(i)
  );
}


/* Recompose */

function recompose(){

  if(paused)return;

  cycle++;

  counter.textContent =
    String(cycle).padStart(2,"0");

  const movers =
    Math.random()<.35
      ? 18
      : 12;

  const ids =
    Array.from(
      {length:N},
      (_,i)=>i
    );

  for(
    let i=ids.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      ids[i],
      ids[j]
    ]=[
      ids[j],
      ids[i]
    ];
  }

  const selected =
    ids.slice(0,movers);

  const targetPool =
    [...freeSlots()];

  for(
    let i=targetPool.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      targetPool[i],
      targetPool[j]
    ]=[
      targetPool[j],
      targetPool[i]
    ];
  }


  selected.forEach((id,k)=>{

    const target =
      targetPool[
        k % targetPool.length
      ];

    if(
      target === slotOf[id]
    )return;

    slotOf[id] =
      target;

    place(
      tiles[id],
      target
    );


    /* Occasionally dissolve
       to another photograph */

    if(Math.random()<.62){

      const back =
        tiles[id]
          .querySelector(".back");

      const next =
        files[
          Math.floor(
            Math.random()*N
          )
        ];

      if(
        back.src !==
        new URL(
          next,
          location.href
        ).href
      ){

        back.src = next;

        tiles[id]
          .classList
          .add("change");

        setTimeout(()=>{

          tiles[id]
            .querySelector(".front")
            .src = back.src;

          tiles[id]
            .classList
            .remove("change");

        },900);
      }
    }
  });


  /* Occasionally exchange two
     photographs without moving
     their positions */

  if(Math.random()<.55){

    const a = ids[0];
    const b = ids[1];

    const ia =
      tiles[a]
        .querySelector(".front")
        .src;

    const ib =
      tiles[b]
        .querySelector(".front")
        .src;

    tiles[a]
      .querySelector(".back")
      .src = ib;

    tiles[b]
      .querySelector(".back")
      .src = ia;

    tiles[a]
      .classList
      .add("change");

    tiles[b]
      .classList
      .add("change");


    setTimeout(()=>{

      tiles[a]
        .querySelector(".front")
        .src = ib;

      tiles[b]
        .querySelector(".front")
        .src = ia;

      tiles[a]
        .classList
        .remove("change");

      tiles[b]
        .classList
        .remove("change");

    },900);
  }
}


/* Start animation */

function start(){

  clearInterval(timer);

  timer =
    setInterval(
      recompose,
      4200
    );
}


/* Manual recompose */

shuffleBtn.onclick = ()=>{

  recompose();

  if(!paused){
    start();
  }
};


/* Pause */

pauseBtn.onclick = ()=>{

  paused = !paused;

  pauseBtn.textContent =
    paused ? "play" : "pause";

  if(paused){
    clearInterval(timer);
  }else{
    start();
  }
};


/* Pause when browser tab isn't visible */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      clearInterval(timer);

    }else if(!paused){

      start();

    }
  }
);


/* Go */

initial();
start();

</script>

</body>
</html>

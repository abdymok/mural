<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ukraine@war — living wall</title>

  <style>
    :root {
      --paper: #f3f1eb;
      --ink: #111;
      --gap: 4px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------------------------------------------
       HEADER
    --------------------------------------------- */

    .masthead {
      position: absolute;
      z-index: 100;
      top: 22px;
      left: 24px;
      pointer-events: none;
    }

    .title {
      margin: 0;
      font-size: clamp(32px, 3.1vw, 54px);
      line-height: .9;
      font-weight: normal;
      letter-spacing: -.055em;
    }

    .subtitle {
      margin-top: 9px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .credit {
      position: absolute;
      z-index: 100;
      top: 22px;
      right: 23px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: .13em;
      text-transform: uppercase;

      writing-mode: vertical-rl;
      transform: rotate(180deg);

      pointer-events: none;
    }

    /* ---------------------------------------------
       WALL

       67 actual image tiles.

       The grid deliberately does NOT create 70
       placeholder cells. It simply lays out the
       67 images that actually exist.
    --------------------------------------------- */

    .wall {
      position: absolute;

      top: 80px;
      right: 24px;
      bottom: 91px;
      left: 24px;

      display: grid;

      /*
        Eight columns gives the images room to breathe
        while allowing 67 genuine tiles to occupy the
        available wall without explicit empty squares.
      */
      grid-template-columns: repeat(8, minmax(0, 1fr));

      grid-auto-rows: 1fr;

      gap: var(--gap);

      align-content: start;

      z-index: 10;
    }

    .tile {
      position: relative;

      /*
        Every tile is square.
      */
      aspect-ratio: 1 / 1;

      min-width: 0;

      overflow: hidden;

      opacity: 0;

      transform:
        translate3d(
          var(--tx, 0px),
          var(--ty, 0px),
          0
        )
        rotate(var(--rot, 0deg))
        scale(var(--scale, 1));

      transition:
        opacity 1.6s ease,
        transform 7s cubic-bezier(.2, .65, .2, 1);

      will-change: transform, opacity;
    }

    .tile.visible {
      opacity: 1;
    }

    .tile img {
      display: block;

      width: 100%;
      height: 100%;

      /*
        The container remains square.
        The source image itself is NEVER stretched.
      */
      object-fit: cover;

      user-select: none;
      -webkit-user-drag: none;

      transition:
        opacity 2.4s ease;
    }

    /* ---------------------------------------------
       HERO

       A hero is simply one of the existing images
       displayed as a larger square.

       It does NOT introduce another image.
    --------------------------------------------- */

    .tile.hero {
      z-index: 30;

      /*
        2×2 square.
      */
      grid-column: span 2;
      grid-row: span 2;

      transform:
        translate3d(
          var(--tx, 0px),
          var(--ty, 0px),
          0
        )
        rotate(var(--rot, 0deg))
        scale(var(--scale, 1));
    }

    .tile.hero img {
      object-fit: cover;
    }

    /* ---------------------------------------------
       FOOTER
    --------------------------------------------- */

    .footer-left {
      position: absolute;
      z-index: 100;
      left: 24px;
      bottom: 22px;
    }

    .footer-label {
      margin-bottom: 7px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .subscribe {
      display: inline-block;

      color: var(--ink);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.2;

      border-bottom: 1px solid rgba(0, 0, 0, .4);
      padding-bottom: 2px;
    }

    .subscribe:hover {
      border-bottom-color: var(--ink);
    }

    .footer-right {
      position: absolute;
      z-index: 100;

      right: 24px;
      bottom: 23px;

      display: flex;
      align-items: center;
      gap: 19px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .counter-line {
      width: 20px;
      height: 1px;
      background: rgba(0, 0, 0, .45);
    }

    button {
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0;

      background: transparent;
      color: var(--ink);

      font: inherit;
      cursor: pointer;
    }

    button:hover {
      opacity: .5;
    }

    /* ---------------------------------------------
       INTRO
    --------------------------------------------- */

    .intro {
      position: fixed;
      z-index: 1000;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--paper);

      pointer-events: none;

      animation: introOut 1.2s ease 1.2s forwards;
    }

    .intro-text {
      font-size: clamp(35px, 6vw, 90px);
      letter-spacing: -.055em;

      opacity: 0;

      animation:
        introIn .8s ease .1s forwards,
        introTextOut .7s ease .85s forwards;
    }

    @keyframes introIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes introTextOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes introOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* ---------------------------------------------
       MOBILE
    --------------------------------------------- */

    @media (max-width: 700px) {

      .masthead {
        top: 15px;
        left: 15px;
      }

      .title {
        font-size: 30px;
      }

      .subtitle {
        margin-top: 7px;
        font-size: 8px;
      }

      .credit {
        top: 15px;
        right: 15px;
        font-size: 8px;
      }

      .wall {
        top: 67px;
        right: 12px;
        bottom: 82px;
        left: 12px;

        grid-template-columns: repeat(5, minmax(0, 1fr));

        gap: 3px;
      }

      .tile.hero {
        grid-column: span 2;
        grid-row: span 2;
      }

      .footer-left {
        left: 15px;
        bottom: 15px;
      }

      .footer-right {
        right: 15px;
        bottom: 16px;
        gap: 12px;
      }

      .subscribe {
        font-size: 12px;
      }
    }

    /* ---------------------------------------------
       REDUCED MOTION
    --------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .intro {
        display: none;
      }

      .tile,
      .tile.hero {
        transition: opacity .3s ease;
        transform: none !important;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <div class="intro" aria-hidden="true">
      <div class="intro-text">ukraine@war</div>
    </div>


    <header class="masthead">
      <h1 class="title">ukraine@war</h1>
      <div class="subtitle">67 images / living wall</div>
    </header>


    <div class="credit">
      drone dept. / 2026
    </div>


    <main
      class="wall"
      id="wall"
      aria-label="Ukraine at war — living wall"
    ></main>


    <div class="footer-left">
      <div class="footer-label">
        The Daily Dispatch
      </div>

      <a
        class="subscribe"
        href="https://abdymok.substack.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read &amp; subscribe on Substack →
      </a>
    </div>


    <div class="footer-right">

      <div class="counter">
        <span id="counter">01</span>
        <span class="counter-line"></span>
      </div>

      <button id="recompose" type="button">
        Recompose
      </button>

      <button id="pause" type="button">
        Pause
      </button>

    </div>

  </div>


  <script>

    /* =================================================
       THE ONLY IMAGES USED BY THIS SITE
       ================================================= */

    const files = [
      "1.jfif",
      "2.jfif",
      "3.jfif",
      "4.jfif",
      "5.jfif",
      "6.jfif"
    ];

    for (let i = 7; i <= 67; i++) {
      files.push(`${i}.jpg`);
    }


    /* =================================================
       STATE
       ================================================= */

    const wall = document.getElementById("wall");
    const counter = document.getElementById("counter");
    const recomposeButton = document.getElementById("recompose");
    const pauseButton = document.getElementById("pause");

    const TOTAL = files.length;

    let tiles = [];
    let paused = false;
    let composition = 0;

    let heroIndex = null;


    /* =================================================
       RANDOM HELPERS
       ================================================= */

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }


    function shuffle(array) {
      const a = [...array];

      for (let i = a.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [a[i], a[j]] = [a[j], a[i]];
      }

      return a;
    }


    /* =================================================
       CREATE THE 67 REAL IMAGE TILES
       ================================================= */

    function createWall() {

      wall.innerHTML = "";
      tiles = [];

      files.forEach((file, index) => {

        const tile = document.createElement("div");

        tile.className = "tile";

        const img = document.createElement("img");

        img.src = file;

        img.alt =
          `Ukraine at war — image ${index + 1}`;

        img.loading =
          index < 16 ? "eager" : "lazy";

        img.decoding = "async";

        /*
          Broken images are hidden rather than replaced
          with anything invented.
        */
        img.addEventListener("error", () => {

          tile.style.display = "none";

        });

        tile.appendChild(img);

        wall.appendChild(tile);

        tiles.push(tile);

      });


      /*
        Fade the actual 67 images in one by one.
      */

      requestAnimationFrame(() => {

        tiles.forEach((tile, index) => {

          setTimeout(() => {

            tile.classList.add("visible");

          }, index * 28);

        });

      });

      updateCounter();

      /*
        Start the first very quiet breathing cycle.
      */
      breathe();

    }


    /* =================================================
       BREATHING

       Extremely small movement.
       The wall should feel alive, not animated.
       ================================================= */

    function breathe() {

      if (paused) {
        return;
      }

      tiles.forEach(tile => {

        if (tile.style.display === "none") {
          return;
        }

        const x = random(-1.8, 1.8);
        const y = random(-1.8, 1.8);
        const r = random(-0.22, 0.22);
        const s = random(.997, 1.003);

        tile.style.setProperty(
          "--tx",
          `${x.toFixed(2)}px`
        );

        tile.style.setProperty(
          "--ty",
          `${y.toFixed(2)}px`
        );

        tile.style.setProperty(
          "--rot",
          `${r.toFixed(2)}deg`
        );

        tile.style.setProperty(
          "--scale",
          s.toFixed(4)
        );

      });

    }


    /* =================================================
       HERO

       One of the existing 67 images becomes a 2×2
       square temporarily.

       We NEVER create a new image.
       ================================================= */

    function chooseHero() {

      if (tiles.length === 0) {
        return;
      }

      /*
        Remove previous hero.
      */

      tiles.forEach(tile => {

        tile.classList.remove("hero");

      });


      /*
        Choose a different existing image.
      */

      let next;

      do {

        next =
          Math.floor(
            Math.random() * tiles.length
          );

      } while (
        tiles.length > 1 &&
        next === heroIndex
      );


      heroIndex = next;

      const hero = tiles[heroIndex];

      hero.classList.add("hero");

      /*
        Very subtle emergence.
      */

      hero.style.setProperty(
        "--scale",
        "0.985"
      );

      setTimeout(() => {

        if (!paused) {

          hero.style.setProperty(
            "--scale",
            "1"
          );

        }

      }, 300);

    }


    /* =================================================
       DISSOLVE

       The image itself doesn't change.

       We use opacity to let the composition settle
       softly after a shuffle.
       ================================================= */

    function dissolve() {

      tiles.forEach(tile => {

        if (tile.style.display === "none") {
          return;
        }

        tile.style.transition =
          "opacity 2.8s ease, transform 7s cubic-bezier(.2,.65,.2,1)";

        tile.style.opacity = "0.55";

      });


      setTimeout(() => {

        tiles.forEach(tile => {

          if (tile.style.display === "none") {
            return;
          }

          tile.style.opacity = "";

        });

      }, 1200);

    }


    /* =================================================
       SHUFFLE

       We shuffle the actual 67 tiles.

       No replacement images.
       No generated images.
       No new content.
       ================================================= */

    function recompose() {

      if (paused) {
        return;
      }

      composition++;

      /*
        Shuffle DOM order.
        The browser then repacks the same 67 images.
      */

      const order = shuffle(tiles);

      order.forEach(tile => {

        wall.appendChild(tile);

      });


      /*
        Occasionally change which existing image
        becomes the hero.

        Not every cycle.
        Restraint.
      */

      if (
        composition % 3 === 0
      ) {

        chooseHero();

      }
      else if (
        composition % 5 === 0
      ) {

        tiles.forEach(tile => {

          tile.classList.remove("hero");

        });

        heroIndex = null;

      }


      dissolve();

      breathe();

      updateCounter();

    }


    /* =================================================
       COUNTER
       ================================================= */

    function updateCounter() {

      const n =
        String(
          (composition + 1) % 100
        ).padStart(2, "0");

      counter.textContent = n;

    }


    /* =================================================
       PAUSE
       ================================================= */

    function togglePause() {

      paused = !paused;

      pauseButton.textContent =
        paused ? "Play" : "Pause";

      if (!paused) {

        breathe();

      }

    }


    /* =================================================
       BUTTONS
       ================================================= */

    recomposeButton.addEventListener(
      "click",
      () => {

        const wasPaused = paused;

        paused = false;

        recompose();

        paused = wasPaused;

        pauseButton.textContent =
          paused ? "Play" : "Pause";

      }
    );


    pauseButton.addEventListener(
      "click",
      togglePause
    );


    /* =================================================
       SLOW AUTOMATIC BREATHING
       ================================================= */

    setInterval(() => {

      if (!paused) {
        breathe();
      }

    }, 6500);


    /* =================================================
       OCCASIONAL RECOMPOSITION

       Deliberately slow.
       ================================================= */

    setInterval(() => {

      if (!paused) {
        recompose();
      }

    }, 15000);


    /* =================================================
       START
       ================================================= */

    createWall();

  </script>

</body>
</html>

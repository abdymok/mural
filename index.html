<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Grid</title>
<style>
  :root {
    --gap: 10px;
    --bg: #ffffff;
    --dissolve: 1.4s;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #grid {
    position: relative;
    width: min(92vw, 92vh);
    height: min(92vw, 92vh);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: var(--gap);
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.10));
  }
  .cell {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f0f0f0;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .cell:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    z-index: 2;
  }
  .cell.hero {
    z-index: 3;
    box-shadow: 0 18px 44px rgba(0,0,0,0.28);
  }
  .cell.hero:hover {
    transform: none; /* don't also scale-hover a cell that's already enlarged */
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    filter: grayscale(1);
    transform: scale(1.04);
    transition: opacity var(--dissolve) ease, transform var(--dissolve) ease, filter calc(var(--dissolve) * 1.3) ease;
  }
  .layer.visible {
    opacity: 1;
    filter: grayscale(0);
    transform: scale(1);
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.06) 100%);
  }
  #watermark {
    position: fixed;
    bottom: 18px;
    right: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.32);
    pointer-events: none;
    user-select: none;
    z-index: 6;
  }
</style>
</head>
<body>

<div id="grid"></div>
<div id="vignette"></div>
<div id="watermark">ukraine@war</div>

<script>
/* ---------- CONFIG ---------- */
const TOTAL_IMAGES    = 67;      // total files available in /images (named 1.jpg ... 67.jpg)
const IMAGE_FOLDER    = "";      // "" = same folder as index.html; set e.g. "images" to use a subfolder instead
const IMAGE_EXT       = "jpg";
const GRID_SIZE       = 5;       // 5x5
const SWAP_INTERVAL   = 1600;    // ms between individual swap events (base — actual timing is jittered)
const SHUFFLE_EVERY   = 5000;    // ms between full position shuffles (base — actual timing is jittered)
const SWAPS_PER_TICK  = 1;       // how many cells swap at each interval tick
const DISSOLVE_MIN    = 1100;    // ms — fastest a single dissolve can be
const DISSOLVE_MAX    = 1900;    // ms — slowest a single dissolve can be
const CLICK_URL       = "https://abdymok.substack.com"; // set to "" to disable click-through
const JITTER          = 0.5;     // +/- 50% randomness on timers, for a less mechanical feel
const HERO_INTERVAL   = 7000;    // ms between featured 2x2 tiles (base — jittered)
const HERO_DURATION   = 5000;    // ms a featured tile stays enlarged

function jitter(ms) {
  return ms * (1 - JITTER + Math.random() * JITTER * 2);
}

function randomDissolveMs() {
  return DISSOLVE_MIN + Math.random() * (DISSOLVE_MAX - DISSOLVE_MIN);
}

// Applies a one-off transition duration to a layer for this dissolve only,
// so not every swap takes the exact same amount of time.
function setDissolveDuration(img, ms) {
  img.style.transitionDuration = `${ms}ms, ${ms}ms, ${ms * 1.3}ms`; // matches opacity, transform, filter order in .layer
}

function imgSrc(id) {
  return IMAGE_FOLDER ? `${IMAGE_FOLDER}/${id}.${IMAGE_EXT}` : `${id}.${IMAGE_EXT}`;
}

// Loads `id` into `img`. If it fails (missing/corrupt file), automatically
// tries a different unused id instead of leaving the cell blank. Logs a
// console warning each time so bad files are easy to spot and fix.
function tryLoad(img, id, attemptsLeft, onSuccess) {
  function cleanup() {
    img.removeEventListener("load", onLoad);
    img.removeEventListener("error", onError);
  }
  function onLoad() { cleanup(); onSuccess(id); }
  function onError() {
    cleanup();
    console.warn("Skipping missing or broken image:", imgSrc(id));
    usedSet.delete(id);
    if (attemptsLeft <= 0) { onSuccess(id); return; } // give up rather than loop forever
    const nextId = nextUnusedId();
    usedSet.add(nextId);
    tryLoad(img, nextId, attemptsLeft - 1, onSuccess);
  }
  img.addEventListener("load", onLoad, { once: true });
  img.addEventListener("error", onError, { once: true });
  img.src = imgSrc(id);
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeLayer() {
  const img = document.createElement("img");
  img.alt = "";
  img.className = "layer";
  return img;
}

/* ---------- SETUP ---------- */
const cellCount = GRID_SIZE * GRID_SIZE;
const allIds = Array.from({length: TOTAL_IMAGES}, (_, i) => i + 1);

let pool = shuffleArray(allIds);
let visibleIds = pool.slice(0, cellCount);
let usedSet = new Set(visibleIds);

const grid = document.getElementById("grid");
const cells = [];

// Explicit grid placement (rather than relying on DOM order + auto-placement)
// is what lets one cell span 2x2 for the featured-tile effect.
function applyGridPos(cellData) {
  cellData.el.style.gridRow = `${cellData.row} / span 1`;
  cellData.el.style.gridColumn = `${cellData.col} / span 1`;
}

for (let i = 0; i < cellCount; i++) {
  const row = Math.floor(i / GRID_SIZE) + 1;
  const col = (i % GRID_SIZE) + 1;

  const cell = document.createElement("div");
  cell.className = "cell";
  grid.appendChild(cell);

  const img = makeLayer();
  cell.appendChild(img); // attach immediately — this is what kicks off the fetch reliably

  const cellData = { el: cell, img, currentId: visibleIds[i], busy: true, row, col };
  applyGridPos(cellData);
  cells.push(cellData);

  if (CLICK_URL) {
    cell.addEventListener("click", () => window.open(CLICK_URL, "_blank", "noopener"));
  }

  tryLoad(img, visibleIds[i], TOTAL_IMAGES, (finalId) => {
    cellData.currentId = finalId;
    cellData.busy = false;
    setTimeout(() => img.classList.add("visible"), i * 60);
  });
}

/* ---------- SWAP LOGIC (dissolve: new image crossfades in on top of the old one) ---------- */
function nextUnusedId() {
  const candidates = allIds.filter(id => !usedSet.has(id));
  if (candidates.length === 0) {
    return allIds[Math.floor(Math.random() * allIds.length)];
  }
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function swapRandomCell() {
  // only ever touch a cell that isn't already mid-transition (or currently
  // the featured hero / hidden behind it) — re-picking a busy cell is what
  // caused the old flicker bug.
  const idleIndices = cells.map((_, i) => i).filter(i => !cells[i].busy);
  if (idleIndices.length === 0) return;
  const idx = idleIndices[Math.floor(Math.random() * idleIndices.length)];
  const cellData = cells[idx];
  const oldImg = cellData.img;

  cellData.busy = true;
  usedSet.delete(cellData.currentId);
  const newId = nextUnusedId();
  usedSet.add(newId);

  const newImg = makeLayer();
  cellData.el.appendChild(newImg); // attach immediately, on top of oldImg — cell is always fully covered by oldImg underneath while newImg loads

  const dur = randomDissolveMs();
  setDissolveDuration(newImg, dur);
  setDissolveDuration(oldImg, dur);

  tryLoad(newImg, newId, TOTAL_IMAGES, (finalId) => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        newImg.classList.add("visible");    // new image dissolves in
        oldImg.classList.remove("visible"); // old image dissolves out, simultaneously
      });
    });
    setTimeout(() => {
      oldImg.remove();
      cellData.img = newImg;
      cellData.currentId = finalId;
      cellData.busy = false;
    }, dur + 80);
  });
}

/* ---------- POSITION SHUFFLE (randomly reassign which cell sits where) ---------- */
function shufflePositions() {
  // exclude any cell currently frozen by an active hero — reassigning their
  // slot while they're not rendered there is what caused blank squares
  const movable = cells.filter(c => !c.frozen);
  const positions = movable.map(c => ({ row: c.row, col: c.col }));
  const shuffled = shuffleArray(positions);
  movable.forEach((c, i) => {
    c.row = shuffled[i].row;
    c.col = shuffled[i].col;
    applyGridPos(c);
  });
}

/* ---------- FEATURED TILE (occasionally one cell spans 2x2) ---------- */
let heroActive = false;

function findCellAt(row, col) {
  return cells.find(c => c.row === row && c.col === col);
}

function triggerHero() {
  if (heroActive) return;
  const topRow = 1 + Math.floor(Math.random() * (GRID_SIZE - 1));
  const topCol = 1 + Math.floor(Math.random() * (GRID_SIZE - 1));
  const block = [
    findCellAt(topRow, topCol),
    findCellAt(topRow, topCol + 1),
    findCellAt(topRow + 1, topCol),
    findCellAt(topRow + 1, topCol + 1),
  ];
  if (block.some(c => !c || c.busy)) return; // skip if a cell is missing OR already mid-transition — grabbing a busy cell caused the intermittent blank-tile bug

  heroActive = true;
  const [heroCell, ...hidden] = block;

  block.forEach(c => { c.busy = true; c.frozen = true; }); // freeze all four during the hero period
  heroCell.isHero = true;
  heroCell.el.classList.add("hero");
  heroCell.el.style.gridRow = `${topRow} / span 2`;
  heroCell.el.style.gridColumn = `${topCol} / span 2`;
  hidden.forEach(c => { c.el.style.display = "none"; });

  setTimeout(() => {
    heroCell.isHero = false;
    heroCell.el.classList.remove("hero");
    applyGridPos(heroCell);
    hidden.forEach(c => { c.el.style.display = ""; });
    block.forEach(c => { c.busy = false; c.frozen = false; });
    heroActive = false;
  }, HERO_DURATION);
}

/* ---------- TIMERS (jittered so the rhythm feels organic, not mechanical) ---------- */
function scheduleSwap() {
  setTimeout(() => {
    for (let i = 0; i < SWAPS_PER_TICK; i++) swapRandomCell();
    scheduleSwap();
  }, jitter(SWAP_INTERVAL));
}

function scheduleShuffle() {
  setTimeout(() => {
    shufflePositions();
    scheduleShuffle();
  }, jitter(SHUFFLE_EVERY));
}

function scheduleHero() {
  setTimeout(() => {
    triggerHero();
    scheduleHero();
  }, jitter(HERO_INTERVAL));
}

scheduleSwap();
scheduleShuffle();
scheduleHero();
</script>

</body>
</html>

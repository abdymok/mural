<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<title>ukraine@war</title>
<style>
:root{--paper:#fff;--ink:#111;--gap:5px;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:Arial,sans-serif}
.title,.intro-text{font-family:"Spectral",Georgia,"Times New Roman",serif}
.page{position:relative;width:100vw;height:100vh}
.masthead{position:absolute;z-index:100;top:22px;left:24px}
.title{margin:0;font-size:clamp(34px,3vw,52px);font-weight:400;line-height:.9;letter-spacing:-.055em}
.subtitle{margin-top:9px;font:9px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.credit{position:absolute;z-index:100;top:22px;right:22px;font:9px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.wall-wrap{position:absolute;z-index:5;left:50%;top:51%;transform:translate(-50%,-50%);width:min(calc(100vw - 48px),calc(100vh - 185px));aspect-ratio:1}
.wall{position:relative;width:100%;height:100%}
.tile{
  position:absolute;overflow:hidden;background:#111;cursor:pointer;
  will-change:transform,width,height,opacity;
  transition:
    transform 2400ms var(--ease),
    width 2400ms var(--ease),
    height 2400ms var(--ease),
    opacity 1600ms ease;
  transform-origin:center center;
}
.tile img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.tile .a{z-index:1;opacity:0;visibility:hidden}
.tile .a.loaded{opacity:1;visibility:visible}
.tile .b{z-index:2;opacity:0;visibility:hidden}
.tile.swap .b.loaded{opacity:1;visibility:visible}
.tile img{transition:opacity 3600ms ease,transform 9000ms var(--ease);will-change:opacity,transform}
.tile.lift .a,.tile.lift .b{transform:scale(1.012)}
.tile.hero-tile{z-index:30;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.tile.hero-tile img{transform:scale(1.002)}
.tile.suspended{pointer-events:none;opacity:.02}
.tile.entering{opacity:0}
.tile.leaving{opacity:0}
.footer-right{position:absolute;z-index:100;right:24px;bottom:23px;display:flex;align-items:center;gap:19px;font:9px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.counter{display:flex;align-items:center;gap:9px}.counter-line{width:20px;height:1px;background:rgba(0,0,0,.45)}
button{border:0;background:none;color:var(--ink);padding:0;font:inherit;cursor:pointer}button:hover{opacity:.5}
.intro{position:fixed;z-index:1000;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:1;transition:opacity 1800ms cubic-bezier(.22,.61,.36,1);visibility:visible}
.intro-logo{display:block;width:140px;height:auto;max-width:30vw;max-height:30vh;object-fit:contain;animation:introin .8s ease both}
@keyframes introin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro.hide{opacity:0;visibility:hidden}

/* Mobile-only adjustments.
   Desktop styles above are unchanged. */
@media (max-width: 700px){
  html,body{
    min-height:100%;
    overflow-x:hidden;
  }

  .masthead{
    left:max(16px, env(safe-area-inset-left)) !important;
    right:auto !important;
  }

  .title,
  .subtitle{
    margin-left:0 !important;
    padding-left:0 !important;
    text-align:left !important;
  }

  .footer-right{
    position:fixed !important;
    right:max(16px, env(safe-area-inset-right)) !important;
    bottom:calc(12px + env(safe-area-inset-bottom)) !important;
    z-index:99999 !important;
    display:flex !important;
    align-items:center !important;
    gap:14px;
    pointer-events:auto !important;
    visibility:visible !important;
    opacity:1 !important;
  }

  .footer-right button{
    display:inline-flex !important;
    position:relative !important;
    z-index:100000 !important;
    white-space:nowrap;
    pointer-events:auto !important;
    visibility:visible !important;
    opacity:1 !important;
  }
}
</style>
</head>
<body>
<div class="page">
  <div class="intro"><img class="intro-logo" src="abdymok.gif" alt="abd ymok"></div>
  <header class="masthead"><h1 class="title">ukraine@war</h1><div class="subtitle">ultra-competitive<br>ukraine-style politics</div></header>
  <div class="credit">drone dept. / 2026</div>
  <div class="wall-wrap"><main id="wall" class="wall"></main></div>
  <div class="footer-right"><div class="counter"><span id="counter">01</span><span class="counter-line"></span></div><button id="recompose">Recompose</button><button id="pause">Pause</button></div>
</div>
<script>
/*
  Living-wall engine
  - 67 source images
  - 8×8 spatial field
  - persistent tile identities (no DOM rebuild during recomposition)
  - up to 3 simultaneous 3×3 heroes
  - clicked tile becomes a hero
  - FLIP-style movement keeps every tile spatially continuous
*/
const FILES=["1.jfif","2.jfif","3.jfif","4.jfif","5.jfif","6.jfif"];
for(let i=7;i<=67;i++) FILES.push(i+".jpg");
const wall=document.getElementById("wall");
const counter=document.getElementById("counter");
const pauseBtn=document.getElementById("pause");
const intro=document.querySelector(".intro");

const N=8, GAP=5, HERO=3, MAX_HEROES=3;
let tiles=[], order=[], heroes=[], round=0, paused=false;
let heartbeat=0, heroHeartbeat=0, breathHeartbeat=0;
const imageCache=new Map();

for(const src of FILES){
  const im=new Image();
  im.decoding="async";
  im.src=src;
  imageCache.set(src,im);
}
function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function tileKey(src){return src.replace(/[^a-z0-9]/gi,"_")}

function waitForImage(src){
  return new Promise((resolve,reject)=>{
    const im=imageCache.get(src);
    if(im && im.complete){
      if(im.naturalWidth>0) resolve(im);
      else reject(new Error("Image failed to load: "+src));
      return;
    }
    if(im){
      im.addEventListener("load",()=>resolve(im),{once:true});
      im.addEventListener("error",()=>reject(new Error("Image failed to load: "+src)),{once:true});
      return;
    }
    const next=new Image();
    next.decoding="async";
    next.addEventListener("load",()=>{imageCache.set(src,next);resolve(next)},{once:true});
    next.addEventListener("error",()=>reject(new Error("Image failed to load: "+src)),{once:true});
    next.src=src;
    imageCache.set(src,next);
  });
}

function createTile(src){
  const tile=document.createElement("div");
  tile.className="tile";
  tile.dataset.src=src;
  tile.dataset.key=tileKey(src);

  const a=document.createElement("img");
  a.className="a";
  a.alt="";
  const b=document.createElement("img");
  b.className="b";
  b.alt="";

  tile.append(a,b);
  wall.append(tile);

  const item={el:tile,src,a,b,row:0,col:0,size:1,hero:false};
  tile.addEventListener("click",()=>promote(item));
  tiles.push(item);

  waitForImage(src).then(()=>{
    if(item.src===src){
      a.src=src;
      a.classList.add("loaded");
    }
  }).catch(()=>{});

  return item;
}

function build(){
  order=shuffle(FILES).slice(0,64);
  order.forEach(createTile);
  layout(true);
}

function metrics(){
  const r=wall.getBoundingClientRect();
  const cell=(r.width-GAP*7)/8;
  return {r,cell,step:cell+GAP};
}
function occupiedByHeroes(){
  const occupied=new Set();
  heroes.forEach(h=>{
    for(let y=h.row;y<h.row+HERO;y++)
      for(let x=h.col;x<h.col+HERO;x++)
        occupied.add(y*8+x);
  });
  return occupied;
}
function chooseHeroOrigin(preferred){
  const occupied=occupiedByHeroes();
  const candidates=[];
  for(let row=0;row<=N-HERO;row++){
    for(let col=0;col<=N-HERO;col++){
      let ok=true;
      for(let y=row;y<row+HERO;y++) for(let x=col;x<col+HERO;x++){
        if(occupied.has(y*8+x)){ok=false;break}
      }
      if(ok){
        const d=preferred?Math.abs(col-preferred.col)+Math.abs(row-preferred.row):0;
        candidates.push({row,col,d});
      }
    }
  }
  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.d-b.d || Math.random()-.5);
  return candidates[0];
}
function currentRects(){
  const m=metrics();
  const map=new Map();
  tiles.forEach(t=>{
    const el=t.el;
    const rect=el.getBoundingClientRect();
    map.set(t,rect);
  });
  return {m,map};
}

function applyLayout(instant=false){
  const {m,before}=applyLayout.beforeData||{};
  const currentM=metrics();
  const occupied=occupiedByHeroes();
  const free=[];
  for(let row=0;row<N;row++) for(let col=0;col<N;col++){
    if(!occupied.has(row*8+col)) free.push({row,col});
  }

  const heroSet=new Set(heroes);
  let freeIndex=0;

  const small=tiles.filter(t=>!heroSet.has(t));
  small.sort((a,b)=>(a.row*8+a.col)-(b.row*8+b.col));
  small.forEach(t=>{
    const p=free[freeIndex++];
    if(p){t.row=p.row;t.col=p.col;t.size=1;}
  });

  heroes.forEach(h=>{h.size=HERO;h.hero=true;});

  tiles.forEach(t=>{
    const x=t.col*currentM.step;
    const y=t.row*currentM.step;
    const size=t.size*currentM.cell+(t.size-1)*GAP;
    const el=t.el;

    el.classList.toggle("hero-tile",t.hero);
    el.style.width=size+"px";
    el.style.height=size+"px";
    el.style.left=x+"px";
    el.style.top=y+"px";
    el.style.zIndex=t.hero?30:10;
  });
  if(instant || !before)return;
  tiles.forEach(t=>{
    const old=before.get(t);
    if(!old)return;
    const now=t.el.getBoundingClientRect();
    const dx=old.left-now.left;
    const dy=old.top-now.top;
    const sx=old.width/now.width;
    const sy=old.height/now.height;
    if(Math.abs(dx)<.5 && Math.abs(dy)<.5 && Math.abs(sx-1)<.002 && Math.abs(sy-1)<.002)return;
    t.el.style.transition="none";
    t.el.style.transform=`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        if(!t.el.isConnected)return;
        t.el.style.transition="";
        t.el.style.transform="translate3d(0,0,0) scale(1,1)";
      });
    });
  });
}
function layout(instant=false){
  const data=currentRects();
  applyLayout.beforeData={before:data.map};
  applyLayout(instant);
  applyLayout.beforeData=null;
}
function swapImage(t,src,delay=0){
  if(!t || t.src===src)return;
  setTimeout(()=>{
    if(paused)return;
    waitForImage(src).then(()=>{
      if(paused || !t || t.src===src)return;

      t.b.classList.remove("loaded");
      t.b.src=src;
      t.b.classList.add("loaded");

      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        if(paused)return;
        t.el.classList.add("swap","lift");
        setTimeout(()=>{
          if(paused)return;
          t.a.src=src;
          t.a.classList.add("loaded");
          t.b.removeAttribute("src");
          t.b.classList.remove("loaded");
          t.el.classList.remove("swap");
          t.src=src;
          t.el.dataset.src=src;
        },3600);
      }));
    }).catch(()=>{});
  },delay);
}
function recompose(){
  if(paused)return;
  round++;
  counter.textContent=String(((round-1)%99)+1).padStart(2,"0");

  const candidates=shuffle(tiles.filter(t=>!t.hero));
  const count=7+Math.floor(Math.random()*5);
  const chosen=candidates.slice(0,count);
  const off=FILES.filter(f=>!tiles.some(t=>t.src===f));
  chosen.forEach((t,i)=>{
    const pool=off.length?off:FILES;
    let src=pool[Math.floor(Math.random()*pool.length)];
    if(src===t.src)src=pool[(pool.indexOf(src)+1)%pool.length];
    swapImage(t,src,i*260);
  });

  if(round%3===0 && heroes.length) rotateHero(heroes[Math.floor(Math.random()*heroes.length)]);
  if(round%5===0 && heroes.length<MAX_HEROES) autoHero();
}
function promote(t){
  if(paused)return;

  if(t.hero){
    removeHero(t);
    return;
  }

  if(heroes.length>=MAX_HEROES){
    removeHero(heroes[0],true);
  }

  const preferred={row:Math.min(t.row,5),col:Math.min(t.col,5)};
  const origin=chooseHeroOrigin(preferred);
  if(!origin)return;

  heroes.push(t);
  t.row=origin.row;t.col=origin.col;t.size=HERO;t.hero=true;
  layout(false);
  t.el.classList.add("lift");
  setTimeout(()=>t.el.classList.remove("lift"),6500);
}

function removeHero(t,silent=false){
  if(!t)return;
  heroes=heroes.filter(h=>h!==t);
  t.hero=false;
  layout(false);
  if(!silent){
    t.el.classList.add("lift");
    setTimeout(()=>t.el.classList.remove("lift"),5000);
  }
}
function rotateHero(t){
  if(!t||paused)return;
  const currentIndex=tiles.indexOf(t);
  const others=shuffle(tiles.filter(x=>!x.hero&&x!==t));
  if(!others.length)return;
  const replacement=others[0];

  const origin={row:t.row,col:t.col};
  const oldHero=t;
  oldHero.hero=false;
  heroes=heroes.filter(h=>h!==oldHero);
  replacement.row=origin.row;
  replacement.col=origin.col;
  replacement.size=HERO;
  replacement.hero=true;
  heroes.push(replacement);

  layout(false);

  void currentIndex;
}

function autoHero(){
  if(paused||heroes.length>=MAX_HEROES)return;
  const candidates=shuffle(tiles.filter(t=>!t.hero));
  if(candidates[0])promote(candidates[0]);
}
function breathe(){
  if(paused)return;
  tiles.forEach((t,i)=>{
    const delay=(i%8)*190;
    setTimeout(()=>{
      if(!paused)t.el.classList.add("lift");
    },delay);
    setTimeout(()=>{
      t.el.classList.remove("lift");
    },delay+5200);
  });
}

function togglePause(){
  paused=!paused;
  pauseBtn.textContent=paused?"Play":"Pause";
  if(paused){
    clearInterval(heartbeat);
    clearInterval(heroHeartbeat);
    clearInterval(breathHeartbeat);
  }else{
    startHeartbeats();
  }
}
function startHeartbeats(){
  clearInterval(heartbeat);
  clearInterval(heroHeartbeat);
  clearInterval(breathHeartbeat);

  heartbeat=setInterval(recompose,6200);
  heroHeartbeat=setInterval(()=>{
    if(paused)return;
    const r=Math.random();
    if(r<.58)autoHero();
    else if(r<.76 && heroes.length)rotateHero(heroes[Math.floor(Math.random()*heroes.length)]);
    else if(r<.9 && heroes.length)removeHero(heroes[0]);
  },7200);
  breathHeartbeat=setInterval(breathe,11500);
}
build();
setTimeout(()=>{
  intro.classList.add("hide");
  setTimeout(()=>intro.style.visibility="hidden",1800);
},6000);

document.getElementById("recompose").addEventListener("click",recompose);
pauseBtn.addEventListener("click",togglePause);

setTimeout(()=>{if(!paused){recompose();autoHero();}},2300);
setTimeout(()=>{if(!paused)autoHero();},6100);

window.addEventListener("resize",()=>{
  tiles.forEach(t=>t.el.style.transition="none");
  layout(true);
  requestAnimationFrame(()=>tiles.forEach(t=>t.el.style.transition=""));
});
startHeartbeats();
</script>
</body>
</html>

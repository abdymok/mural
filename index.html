<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ukraine@war — living wall</title>

<style>
  :root {
    --paper: #f3f1eb;
    --ink: #111;
    --gap: 5px;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
  }

  .page {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------------- HEADER ---------------- */

  .masthead {
    position: absolute;
    z-index: 100;
    top: 22px;
    left: 24px;
  }

  .title {
    margin: 0;
    font-size: clamp(32px, 3vw, 52px);
    line-height: .9;
    font-weight: normal;
    letter-spacing: -.055em;
  }

  .subtitle {
    margin-top: 9px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .credit {
    position: absolute;
    z-index: 100;
    top: 22px;
    right: 23px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .13em;
    text-transform: uppercase;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  /* ---------------- WALL ----------------
     The wall is ALWAYS a true 8 x 8 square.
     Tile size is calculated from the wall size,
     never from a stretched row/column.
  ------------------------------------------ */

  .wall-wrap {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 51%;
    transform: translate(-50%, -50%);

    width: min(
      calc(100vw - 48px),
      calc(100vh - 190px)
    );

    aspect-ratio: 1 / 1;
  }

  .wall {
    position: relative;
    width: 100%;
    height: 100%;

    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: var(--gap);
  }

  .tile {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;

    opacity: 0;

    /* Subtle breathing only. */
    transform:
      translate3d(var(--x, 0px), var(--y, 0px), 0)
      scale(var(--s, 1));

    transition:
      opacity 1.7s ease,
      transform 7s cubic-bezier(.22, .61, .36, 1);

    will-change: transform, opacity;
  }

  .tile.visible {
    opacity: 1;
  }

  .tile img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ---------------- HERO ----------------
     Hero is exactly 2 x 2 normal tile units.
     It is an overlay, so every underlying square
     remains occupied.
  ------------------------------------------ */

  .hero {
    position: fixed;
    z-index: 80;

    width: var(--hero-size);
    height: var(--hero-size);

    overflow: hidden;
    opacity: 0;

    transform:
      translate3d(var(--hero-x), var(--hero-y), 0)
      scale(.965);

    transition:
      opacity 2s ease,
      transform 2.4s cubic-bezier(.22, .61, .36, 1);

    pointer-events: none;

    box-shadow: 0 0 0 1px rgba(0,0,0,.12);
  }

  .hero.show {
    opacity: 1;
    transform:
      translate3d(var(--hero-x), var(--hero-y), 0)
      scale(1);
  }

  .hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* ---------------- FOOTER ---------------- */

  .footer-left {
    position: absolute;
    z-index: 100;
    left: 24px;
    bottom: 22px;
  }

  .footer-label {
    margin-bottom: 7px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .subscribe {
    display: inline-block;
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.2;
    border-bottom: 1px solid rgba(0,0,0,.4);
    padding-bottom: 2px;
  }

  .subscribe:hover { border-bottom-color: var(--ink); }

  .footer-right {
    position: absolute;
    z-index: 100;
    right: 24px;
    bottom: 23px;

    display: flex;
    align-items: center;
    gap: 19px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .counter {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .counter-line {
    width: 20px;
    height: 1px;
    background: rgba(0,0,0,.45);
  }

  button {
    appearance: none;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }

  button:hover { opacity: .5; }

  /* ---------------- INTRO ---------------- */

  .intro {
    position: fixed;
    z-index: 1000;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--paper);
    pointer-events: none;

    animation: introOut 1s ease 1.25s forwards;
  }

  .intro-text {
    font-size: clamp(35px, 6vw, 90px);
    letter-spacing: -.055em;
    opacity: 0;

    animation:
      introIn .8s ease .1s forwards,
      introTextOut .7s ease .85s forwards;
  }

  @keyframes introIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes introTextOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  @keyframes introOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  /* ---------------- MOBILE ---------------- */

  @media (max-width: 700px) {
    .masthead {
      top: 15px;
      left: 15px;
    }

    .title { font-size: 30px; }

    .subtitle {
      margin-top: 7px;
      font-size: 8px;
    }

    .credit {
      top: 15px;
      right: 15px;
      font-size: 8px;
    }

    .wall-wrap {
      width: min(
        calc(100vw - 30px),
        calc(100vh - 155px)
      );
      top: 49%;
    }

    .footer-left {
      left: 15px;
      bottom: 15px;
    }

    .footer-right {
      right: 15px;
      bottom: 16px;
      gap: 12px;
    }

    .subscribe { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .intro { display: none; }

    .tile,
    .hero,
    .hero.show {
      transition: opacity .3s ease;
      transform: none !important;
    }
  }
</style>
</head>

<body>
<div class="page">

  <div class="intro" aria-hidden="true">
    <div class="intro-text">ukraine@war</div>
  </div>

  <header class="masthead">
    <h1 class="title">ukraine@war</h1>
    <div class="subtitle">67 images / living wall</div>
  </header>

  <div class="credit">drone dept. / 2026</div>

  <div class="wall-wrap">
    <main class="wall" id="wall" aria-label="Ukraine at war — living wall"></main>
  </div>

  <div class="footer-left">
    <div class="footer-label">The Daily Dispatch</div>
    <a
      class="subscribe"
      href="https://abdymok.substack.com/"
      target="_blank"
      rel="noopener noreferrer"
    >Read &amp; subscribe on Substack →</a>
  </div>

  <div class="footer-right">
    <div class="counter">
      <span id="counter">01</span>
      <span class="counter-line"></span>
    </div>

    <button id="recompose" type="button">Recompose</button>
    <button id="pause" type="button">Pause</button>
  </div>
</div>

<script>
/*
  =====================================================
  SOURCE OF TRUTH
  =====================================================

  These are the ONLY images this page is allowed to use.
  There are exactly 67 of them in the repository.
*/

const FILES = [
  "1.jfif",
  "2.jfif",
  "3.jfif",
  "4.jfif",
  "5.jfif",
  "6.jfif"
];

for (let i = 7; i <= 67; i++) {
  FILES.push(`${i}.jpg`);
}


/*
  =====================================================
  WALL RULES
  =====================================================

  64 visible squares at all times.
  67 source images total.
  A shuffle selects 64 of the 67.
  No blank cell is ever created.
*/

const GRID = 8;
const VISIBLE = GRID * GRID;

const wall = document.getElementById("wall");
const counter = document.getElementById("counter");
const recomposeButton = document.getElementById("recompose");
const pauseButton = document.getElementById("pause");

let tiles = [];
let activeFiles = [];
let unusedFiles = [];
let paused = false;
let composition = 0;
let heroElement = null;
let heroFile = null;


/*
  Fisher-Yates shuffle.
*/

function shuffle(array) {
  const a = [...array];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}


/*
  =====================================================
  INITIAL WALL
  =====================================================

  Choose 64 of the 67.
  Every grid cell gets an image immediately.
*/

function initialFiles() {
  const chosen = shuffle(FILES).slice(0, VISIBLE);

  activeFiles = chosen;
  unusedFiles = FILES.filter(file => !chosen.includes(file));
}


/*
  Create exactly 64 DOM tiles.
*/

function buildWall() {
  wall.innerHTML = "";
  tiles = [];

  activeFiles.forEach((file, index) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.index = index;

    const img = document.createElement("img");
    img.src = file;
    img.alt = `Ukraine at war — image ${FILES.indexOf(file) + 1}`;
    img.decoding = "async";

    /*
      If an image fails, do NOT replace it with anything.
      The browser keeps the tile; there is no invented asset.
    */
    img.addEventListener("error", () => {
      tile.style.visibility = "hidden";
    });

    tile.appendChild(img);
    wall.appendChild(tile);
    tiles.push(tile);
  });


  /*
    Fade the complete wall in.
    There are no delayed/empty cells.
  */
  requestAnimationFrame(() => {
    tiles.forEach((tile, index) => {
      setTimeout(() => {
        tile.classList.add("visible");
      }, index * 12);
    });
  });
}


/*
  =====================================================
  VERY SMALL BREATHING MOVEMENT
  =====================================================

  The squares do not move enough to break the grid.
  This is deliberately restrained.
*/

function breathe() {
  if (paused) return;

  tiles.forEach(tile => {
    tile.style.setProperty(
      "--x",
      `${(Math.random() * 1.6 - .8).toFixed(2)}px`
    );

    tile.style.setProperty(
      "--y",
      `${(Math.random() * 1.6 - .8).toFixed(2)}px`
    );

    tile.style.setProperty(
      "--s",
      (1 + (Math.random() * .002 - .001)).toFixed(4)
    );
  });
}


/*
  =====================================================
  DISSOLVE ONE TILE INTO ANOTHER REAL IMAGE
  =====================================================

  No blank state.
  No white flash.
  The old image remains underneath while the new
  image fades over it.
*/

function dissolveTile(tile, newFile) {
  const oldImg = tile.querySelector("img");

  if (!oldImg) return;

  const newImg = document.createElement("img");
  newImg.src = newFile;
  newImg.alt = `Ukraine at war — image ${FILES.indexOf(newFile) + 1}`;
  newImg.decoding = "async";

  newImg.style.position = "absolute";
  newImg.style.inset = "0";
  newImg.style.width = "100%";
  newImg.style.height = "100%";
  newImg.style.objectFit = "cover";
  newImg.style.opacity = "0";
  newImg.style.transition = "opacity 1.8s ease";

  tile.appendChild(newImg);

  requestAnimationFrame(() => {
    newImg.style.opacity = "1";
  });

  setTimeout(() => {
    oldImg.remove();
    newImg.style.position = "";
    newImg.style.inset = "";
    newImg.style.opacity = "";
    newImg.style.transition = "";
  }, 1900);
}


/*
  =====================================================
  SHUFFLE / RECOMPOSE
  =====================================================

  We don't physically move the DOM grid.
  Instead, a few cells quietly dissolve into
  other members of the 67-image collection.

  This preserves the perfect 8 x 8 geometry.
*/

function recompose() {
  if (paused) return;

  composition++;

  /*
    Pick 4–7 cells to change.
    This is enough to make the wall feel alive
    without turning it into visual noise.
  */
  const count = 4 + Math.floor(Math.random() * 4);

  const indexes = shuffle(
    Array.from({ length: VISIBLE }, (_, i) => i)
  ).slice(0, count);

  /*
    Keep track of the old files so we don't duplicate
    an image unnecessarily during the transition.
  */
  const nextPool = shuffle(FILES);

  indexes.forEach((index, n) => {
    const tile = tiles[index];
    const oldFile = activeFiles[index];

    /*
      Find a real source image not currently occupying
      the selected cell.
    */
    let newFile = nextPool.find(file => file !== oldFile);

    /*
      Prefer one of the three currently unused files
      when possible. This makes the whole 67-image
      collection circulate through the 64 positions.
    */
    if (unusedFiles.length) {
      const candidate = shuffle(unusedFiles)
        .find(file => file !== oldFile);

      if (candidate) newFile = candidate;
    }

    if (!newFile) return;

    /*
      Swap bookkeeping:
      old image becomes available; new image becomes active.
    */
    unusedFiles = unusedFiles.filter(file => file !== newFile);

    if (!unusedFiles.includes(oldFile)) {
      unusedFiles.push(oldFile);
    }

    activeFiles[index] = newFile;

    setTimeout(() => {
      dissolveTile(tile, newFile);
    }, n * 130);
  });

  breathe();

  /*
    Hero appears only occasionally.
  */
  if (composition % 4 === 0 && !heroElement) {
    setTimeout(showHero, 1200);
  }

  /*
    Occasionally let the hero disappear.
  */
  if (composition % 5 === 0 && heroElement) {
    setTimeout(hideHero, 700);
  }

  updateCounter();
}


/*
  =====================================================
  HERO
  =====================================================

  A hero is a 2 x 2 square made from one of the
  EXISTING 67 images.

  It is an overlay. Therefore the 64 underlying
  squares remain completely filled.
*/

function showHero() {
  if (paused || heroElement) return;

  /*
    Choose an image that is currently visible.
    Therefore the hero is literally one of the
    images already in the wall.
  */
  const visibleIndex =
    Math.floor(Math.random() * activeFiles.length);

  const file = activeFiles[visibleIndex];

  heroFile = file;

  const hero = document.createElement("div");
  hero.className = "hero";

  const img = document.createElement("img");
  img.src = file;
  img.alt = `Ukraine at war — image ${FILES.indexOf(file) + 1}`;
  img.decoding = "async";

  hero.appendChild(img);
  document.body.appendChild(hero);

  /*
    Calculate the actual normal tile size from
    the rendered 8 x 8 wall.

    Hero = exactly two tile widths + one gap
         = exactly two tile heights + one gap.
  */
  const wallRect = wall.getBoundingClientRect();

  const tileSize =
    (wallRect.width - 7 * parseFloat(
      getComputedStyle(wall).gap
    )) / 8;

  const gap =
    parseFloat(getComputedStyle(wall).gap);

  const heroSize =
    tileSize * 2 + gap;

  /*
    Keep the hero inside the viewport and clear of
    the header/footer.
  */
  const margin = 18;

  const minX = margin;
  const maxX = Math.max(
    minX,
    window.innerWidth - heroSize - margin
  );

  const minY = 92;
  const maxY = Math.max(
    minY,
    window.innerHeight - heroSize - 78
  );

  const x =
    minX + Math.random() * (maxX - minX);

  const y =
    minY + Math.random() * (maxY - minY);

  hero.style.setProperty(
    "--hero-size",
    `${heroSize}px`
  );

  hero.style.setProperty(
    "--hero-x",
    `${x}px`
  );

  hero.style.setProperty(
    "--hero-y",
    `${y}px`
  );

  heroElement = hero;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      hero.classList.add("show");
    });
  });
}


function hideHero() {
  if (!heroElement) return;

  const hero = heroElement;

  hero.classList.remove("show");
  heroElement = null;
  heroFile = null;

  setTimeout(() => {
    if (hero.parentNode) {
      hero.parentNode.removeChild(hero);
    }
  }, 2200);
}


/*
  =====================================================
  COUNTER
  =====================================================
*/

function updateCounter() {
  counter.textContent =
    String((composition + 1) % 100).padStart(2, "0");
}


/*
  =====================================================
  PAUSE
  =====================================================
*/

function togglePause() {
  paused = !paused;

  pauseButton.textContent =
    paused ? "Play" : "Pause";

  if (paused) {
    if (heroElement) hideHero();
  } else {
    breathe();
  }
}


/*
  =====================================================
  CONTROLS
  =====================================================
*/

recomposeButton.addEventListener("click", () => {
  const wasPaused = paused;

  paused = false;
  recompose();

  paused = wasPaused;

  pauseButton.textContent =
    paused ? "Play" : "Pause";
});

pauseButton.addEventListener(
  "click",
  togglePause
);


/*
  =====================================================
  SLOW RHYTHM
  =====================================================
*/

setInterval(() => {
  if (!paused) breathe();
}, 6500);

setInterval(() => {
  if (!paused) recompose();
}, 18000);


/*
  =====================================================
  RESIZE
  =====================================================

  The wall remains square because its container has
  aspect-ratio: 1 / 1.

  If resized while a hero is present, remove it so
  the next hero is calculated from the new tile size.
*/

window.addEventListener("resize", () => {
  if (heroElement) hideHero();
});


/*
  =====================================================
  START
  =====================================================
*/

initialFiles();
buildWall();
breathe();

</script>
</body>
</html>

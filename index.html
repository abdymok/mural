  <title>ukraine@war</title>

  <style>
    :root {
      --paper: #f3f1eb;
      --ink: #0a0a09;
      --gap: 3px;
      --cols: 10;
      --rows: 7;
      --dur: 1200ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
    }

    .wall {
      position: absolute;
      inset: 18px;
      overflow: hidden;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(
        (100% - (var(--cols) - 1) * var(--gap)) / var(--cols)
      );
      height: calc(
        (100% - (var(--rows) - 1) * var(--gap)) / var(--rows)
      );
      transition:
        transform var(--dur) cubic-bezier(.2,.75,.2,1),
        opacity var(--dur) ease;
      will-change: transform;
      pointer-events: none;
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,0,0,.07);
      z-index: 5;
      pointer-events: none;
    }

    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transition:
        transform 2.2s cubic-bezier(.2,.7,.2,1),
        filter 1.2s ease,
        opacity .8s ease;
    }

    .tile .back {
      opacity: 0;
      z-index: 2;
    }

    .tile .front {
      opacity: 1;
      z-index: 1;
    }

    .tile.change .front {
      opacity: 0;
    }

    .tile.change .back {
      opacity: 1;
      transform: scale(1.04);
    }

    /* Masthead */

    .mast {
      position: fixed;
      z-index: 30;
      top: 25px;
      left: 27px;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .mast h1 {
      margin: 0;
      font-size: clamp(18px, 2vw, 31px);
      font-weight: 400;
      letter-spacing: -.04em;
      line-height: .9;
    }

    .mast p {
      margin: 9px 0 0;
      font: 10px/1.2 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    /* Credit */

    .mark {
      position: fixed;
      z-index: 30;
      right: 28px;
      top: 25px;
      font: 10px/1 Arial, sans-serif;
      letter-spacing: .15em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      opacity: .72;
    }

    /* Substack link */

    .subscribe {
      position: fixed;
      z-index: 35;
      left: 27px;
      bottom: 24px;
      color: var(--ink);
      text-decoration: none;
      max-width: 340px;
    }

    .subscribe-label {
      display: block;
      margin-bottom: 7px;
      font: 10px/1 Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
      opacity: .62;
    }

    .subscribe-title {
      display: inline-block;
      font: 16px/1.15 Georgia, "Times New Roman", serif;
      letter-spacing: -.015em;
      border-bottom: 1px solid rgba(10,10,9,.55);
      padding-bottom: 2px;
      transition: opacity .2s ease;
    }

    .subscribe:hover .subscribe-title {
      opacity: .58;
    }

    /* Controls */

    .controls {
      position: fixed;
      z-index: 40;
      right: 26px;
      bottom: 23px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 10px Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
      padding: 7px 0;
      cursor: pointer;
    }

    button:hover {
      opacity: .55;
    }

    button + button {
      margin-left: 14px;
    }

    .rule {
      width: 20px;
      height: 1px;
      background: currentColor;
      opacity: .5;
    }

    .counter {
      font: 10px Arial, sans-serif;
      letter-spacing: .11em;
      opacity: .65;
    }

    /* Intro */

    .intro {
      position: fixed;
      z-index: 100;
      inset: 0;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: intro 2.1s cubic-bezier(.65,0,.35,1) forwards;
    }

    .intro span {
      font-size: clamp(30px, 7vw, 100px);
      letter-spacing: -.065em;
      font-weight: 400;
      transform: translateY(10px);
      animation: introtext 1.8s ease forwards;
    }

    @keyframes intro {
      0%, 72% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes introtext {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      35% {
        opacity: 1;
        transform: translateY(0);
      }

      72% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* Mobile */

    @media (max-width: 800px) {
      .wall {
        inset: 12px;
      }

      .mast {
        top: 18px;
        left: 18px;
      }

      .mark {
        right: 18px;
        top: 18px;
      }

      .subscribe {
        left: 18px;
        bottom: 17px;
      }

      .subscribe-title {
        font-size: 15px;
      }

      .controls {
        right: 18px;
        bottom: 15px;
      }

      .tile {
        width: calc(
          (100% - (var(--cols) - 1) * 2px) / var(--cols)
        );
        height: calc(
          (100% - (var(--rows) - 1) * 2px) / var(--rows)
        );
      }
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      .intro {
        display: none;
      }

      .tile {
        transition: none;
      }

      .tile img {
        transition: none;
      }
    }
  </style>

</head>

  </div>

  <div class="intro">
    <span>ukraine@war</span>
  </div>

  <script>
    /*
      Repository image structure:

      1.jfif
      2.jfif
      3.jfif
      4.jfif
      5.jfif
      6.jfif
      7.jpg
      8.jpg
      ...
      67.jpg

      All files live alongside index.html.
    */

    const files = [
      "1.jfif",
      "2.jfif",
      "3.jfif",
      "4.jfif",
      "5.jfif",
      "6.jfif",
      ...Array.from(
        { length: 61 },
        (_, i) => `${i + 7}.jpg`
      )
    ];

    const wall = document.getElementById("wall");
    const counter = document.getElementById("counter");
    const pauseBtn = document.getElementById("pause");
    const shuffleBtn = document.getElementById("shuffle");

    const N = files.length;
    const SLOTS = 70;
    const COLS = 10;
    const ROWS = 7;

    let tiles = [];
    let slotOf = [];
    let cycle = 0;
    let paused = false;
    let timer = null;

    /* Position a tile */

    function xy(slot) {
      const c = slot % COLS;
      const r = Math.floor(slot / COLS);

      return {
        x: `calc(${c} * ((100% - ${(COLS - 1)} * var(--gap)) / ${COLS} + var(--gap))`,
        y: `calc(${r} * ((100% - ${(ROWS - 1)} * var(--gap)) / ${ROWS} + var(--gap))`
      };
    }

    function place(el, slot) {
      const p = xy(slot);
      el.style.transform = `translate(${p.x}, ${p.y})`;
    }

    /* Create a photograph tile */

    function make(i) {
      const tile = document.createElement("figure");
      tile.className = "tile";

      const front = document.createElement("img");
      const back = document.createElement("img");

      front.className = "front";
      back.className = "back";

      front.alt = "";
      back.alt = "";

      front.loading = i < 20 ? "eager" : "lazy";
      front.decoding = "async";
      back.decoding = "async";

      front.src = files[i];

      tile.append(front, back);
      wall.append(tile);

      return tile;
    }

    /* Fisher-Yates shuffle */

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
      }

      return array;
    }

    /* Random initial positions */

    function sampleSlots() {
      const slots = Array.from(
        { length: SLOTS },
        (_, i) => i
      );

      shuffle(slots);

      return slots.slice(0, N);
    }

    /* Initial wall */

    function initial() {
      slotOf = sampleSlots();

      tiles = files.map((_, i) => make(i));

      tiles.forEach((tile, i) => {
        place(tile, slotOf[i]);
      });
    }

    /*
      Recompose.

      There are only 3 empty slots because:
      70 total slots - 67 images = 3 empty slots.

      We therefore move at most 3 tiles per cycle.
      This prevents two tiles from being assigned
      to the same slot.
    */

    function recompose() {
      if (paused) return;

      cycle++;

      counter.textContent =
        String(cycle).padStart(2, "0");

      const movers = Math.min(
        3,
        1 + Math.floor(Math.random() * 3)
      );

      const ids = shuffle(
        Array.from(
          { length: N },
          (_, i) => i
        )
      );

      const selected = ids.slice(0, movers);

      const used = new Set(slotOf);

      const targetPool = shuffle(
        Array.from(
          { length: SLOTS },
          (_, i) => i
        ).filter(slot => !used.has(slot))
      );

      selected.forEach((id, k) => {
        const target = targetPool[k];

        if (target === undefined) return;

        slotOf[id] = target;

        place(tiles[id], target);

        /*
          Occasionally dissolve the tile into
          another photograph.
        */

        if (Math.random() < 0.62) {
          dissolveToRandomImage(tiles[id]);
        }
      });

      /*
        Occasionally exchange the photographs
        belonging to two tiles without changing
        their positions.
      */

      if (Math.random() < 0.55) {
        exchangeImages(ids[0], ids[1]);
      }
    }

    /* Crossfade one tile to another image */

    function dissolveToRandomImage(tile) {
      const front = tile.querySelector(".front");
      const back = tile.querySelector(".back");

      const current = front.getAttribute("src");

      let next = current;

      if (files.length > 1) {
        while (next === current) {
          next =
            files[
              Math.floor(
                Math.random() * files.length
              )
            ];
        }
      }

      back.src = next;

      tile.classList.add("change");

      setTimeout(() => {
        front.src = next;
        tile.classList.remove("change");
      }, 900);
    }

    /* Exchange images between two tiles */

    function exchangeImages(a, b) {
      if (
        a === undefined ||
        b === undefined ||
        a === b
      ) {
        return;
      }

      const tileA = tiles[a];
      const tileB = tiles[b];

      const frontA =
        tileA.querySelector(".front");

      const frontB =
        tileB.querySelector(".front");

      const backA =
        tileA.querySelector(".back");

      const backB =
        tileB.querySelector(".back");

      const imageA =
        frontA.getAttribute("src");

      const imageB =
        frontB.getAttribute("src");

      backA.src = imageB;
      backB.src = imageA;

      tileA.classList.add("change");
      tileB.classList.add("change");

      setTimeout(() => {
        frontA.src = imageB;
        frontB.src = imageA;

        tileA.classList.remove("change");
        tileB.classList.remove("change");
      }, 900);
    }

    /* Start animation */

    function start() {
      clearInterval(timer);

      timer = setInterval(
        recompose,
        4200
      );
    }

    /* Manual recompose */

    shuffleBtn.addEventListener(
      "click",
      () => {
        recompose();

        if (!paused) {
          start();
        }
      }
    );

    /* Pause / play */

    pauseBtn.addEventListener(
      "click",
      () => {
        paused = !paused;

        pauseBtn.textContent =
          paused ? "play" : "pause";

        if (paused) {
          clearInterval(timer);
        } else {
          start();
        }
      }
    );

    /* Pause when browser tab isn't visible */

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          clearInterval(timer);
        } else if (!paused) {
          start();
        }
      }
    );

    /* Go */

    initial();
    start();
  </script>

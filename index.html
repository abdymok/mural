<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ukraine@war — living wall</title>

<style>
  :root {
    --paper: #f3f1eb;
    --ink: #111;
    --gap: 5px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
  }

  .page {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ================================================
     HEADER
  ================================================ */

  .masthead {
    position: absolute;
    z-index: 100;
    top: 22px;
    left: 24px;
    pointer-events: none;
  }

  .title {
    margin: 0;
    font-size: clamp(32px, 3vw, 52px);
    line-height: .9;
    font-weight: normal;
    letter-spacing: -.055em;
  }

  .subtitle {
    margin-top: 9px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .credit {
    position: absolute;
    z-index: 100;

    top: 22px;
    right: 23px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .13em;
    text-transform: uppercase;

    writing-mode: vertical-rl;
    transform: rotate(180deg);

    pointer-events: none;
  }


  /* ================================================
     WALL

     8 × 8 = 64 square positions.

     The other 3 images become occasional heroes
     and sit above this grid.
  ================================================ */

  .wall {
    position: absolute;

    top: 104px;
    left: 24px;
    right: 24px;
    bottom: 91px;

    display: grid;

    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));

    gap: var(--gap);

    /*
      This is important:
      the grid itself is square in its logic, but the
      individual image cells remain perfectly square.
    */
    align-content: start;

    z-index: 10;
  }


  /* ================================================
     REGULAR TILE
  ================================================ */

  .tile {
    position: relative;

    width: 100%;
    aspect-ratio: 1 / 1;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    opacity: 0;

    transform:
      translate3d(
        var(--x, 0px),
        var(--y, 0px),
        0
      )
      rotate(var(--r, 0deg))
      scale(var(--s, 1));

    transition:
      opacity 1.8s ease,
      transform 8s cubic-bezier(.2, .65, .2, 1);

    will-change: transform, opacity;
  }

  .tile.visible {
    opacity: 1;
  }


  /* ================================================
     IMAGE

     NEVER STRETCHED.
     Every container is square.
  ================================================ */

  .tile img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    user-select: none;
    -webkit-user-drag: none;

    transition:
      opacity 2.5s ease;
  }


  /* ================================================
     HERO

     A hero is simply one of the existing images,
     enlarged to a 2 × 2 square.

     It floats above the grid.
  ================================================ */

  .hero {
    position: fixed !important;

    z-index: 80;

    width: var(--hero-size);
    height: var(--hero-size);

    aspect-ratio: 1 / 1;

    overflow: hidden;

    opacity: 0;

    pointer-events: none;

    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .12);

    transform:
      translate3d(
        var(--hero-x),
        var(--hero-y),
        0
      )
      scale(.94);

    transition:
      opacity 2.2s ease,
      transform 2.8s cubic-bezier(.2, .7, .2, 1);
  }

  .hero.show {
    opacity: 1;

    transform:
      translate3d(
        var(--hero-x),
        var(--hero-y),
        0
      )
      scale(1);
  }

  .hero img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
  }


  /* ================================================
     FOOTER
  ================================================ */

  .footer-left {
    position: absolute;
    z-index: 100;

    left: 24px;
    bottom: 22px;
  }

  .footer-label {
    margin-bottom: 7px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .subscribe {
    display: inline-block;

    color: var(--ink);
    text-decoration: none;

    font-size: 14px;
    line-height: 1.2;

    border-bottom: 1px solid rgba(0, 0, 0, .4);

    padding-bottom: 2px;
  }

  .subscribe:hover {
    border-bottom-color: var(--ink);
  }


  .footer-right {
    position: absolute;
    z-index: 100;

    right: 24px;
    bottom: 23px;

    display: flex;
    align-items: center;
    gap: 19px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .counter {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .counter-line {
    width: 20px;
    height: 1px;

    background: rgba(0, 0, 0, .45);
  }

  button {
    appearance: none;

    border: 0;
    padding: 0;
    margin: 0;

    background: transparent;
    color: var(--ink);

    font: inherit;

    cursor: pointer;
  }

  button:hover {
    opacity: .5;
  }


  /* ================================================
     INTRO
  ================================================ */

  .intro {
    position: fixed;
    z-index: 1000;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--paper);

    pointer-events: none;

    animation:
      introOut 1.2s ease 1.25s forwards;
  }

  .intro-text {
    font-size: clamp(35px, 6vw, 90px);
    letter-spacing: -.055em;

    opacity: 0;

    animation:
      introIn .8s ease .1s forwards,
      introTextOut .7s ease .85s forwards;
  }

  @keyframes introIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes introTextOut {
    from {
      opacity: 1;
    }

    to {
      opacity: 0;
    }
  }

  @keyframes introOut {
    from {
      opacity: 1;
    }

    to {
      opacity: 0;
    }
  }


  /* ================================================
     MOBILE
  ================================================ */

  @media (max-width: 700px) {

    .masthead {
      top: 15px;
      left: 15px;
    }

    .title {
      font-size: 30px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 8px;
    }

    .credit {
      top: 15px;
      right: 15px;
      font-size: 8px;
    }

    .wall {
      top: 76px;
      left: 12px;
      right: 12px;
      bottom: 82px;

      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(6, minmax(0, 1fr));

      gap: 3px;
    }

    .footer-left {
      left: 15px;
      bottom: 15px;
    }

    .footer-right {
      right: 15px;
      bottom: 16px;
      gap: 12px;
    }

    .subscribe {
      font-size: 12px;
    }
  }


  /* ================================================
     REDUCED MOTION
  ================================================ */

  @media (prefers-reduced-motion: reduce) {

    .intro {
      display: none;
    }

    .tile,
    .hero,
    .hero.show {
      transition: opacity .3s ease;
      transform: none !important;
    }
  }
</style>
</head>


<body>

<div class="page">


  <!-- ============================================
       INTRO
  ============================================= -->

  <div class="intro" aria-hidden="true">
    <div class="intro-text">
      ukraine@war
    </div>
  </div>


  <!-- ============================================
       HEADER
  ============================================= -->

  <header class="masthead">

    <h1 class="title">
      ukraine@war
    </h1>

    <div class="subtitle">
      67 images / living wall
    </div>

  </header>


  <div class="credit">
    drone dept. / 2026
  </div>


  <!-- ============================================
       WALL

       Only the 67 real files are used.
  ============================================= -->

  <main
    class="wall"
    id="wall"
    aria-label="Ukraine at war — living wall"
  ></main>


  <!-- ============================================
       FOOTER
  ============================================= -->

  <div class="footer-left">

    <div class="footer-label">
      The Daily Dispatch
    </div>

    <a
      class="subscribe"
      href="https://abdymok.substack.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Read &amp; subscribe on Substack →
    </a>

  </div>


  <div class="footer-right">

    <div class="counter">
      <span id="counter">01</span>
      <span class="counter-line"></span>
    </div>

    <button
      id="recompose"
      type="button"
    >
      Recompose
    </button>

    <button
      id="pause"
      type="button"
    >
      Pause
    </button>

  </div>

</div>


<script>

/* ==================================================
   THE 67 ACTUAL FILES

   Nothing else is permitted into the wall.
================================================== */

const files = [
  "1.jfif",
  "2.jfif",
  "3.jfif",
  "4.jfif",
  "5.jfif",
  "6.jfif"
];

for (let i = 7; i <= 67; i++) {
  files.push(`${i}.jpg`);
}


/* ==================================================
   ELEMENTS
================================================== */

const wall =
  document.getElementById("wall");

const counter =
  document.getElementById("counter");

const recomposeButton =
  document.getElementById("recompose");

const pauseButton =
  document.getElementById("pause");


/* ==================================================
   STATE
================================================== */

let tiles = [];

let paused = false;

let composition = 0;

let currentHero = null;

let heroVisible = false;


/* ==================================================
   HELPERS
================================================== */

function random(min, max) {

  return Math.random() * (max - min) + min;

}


function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;
}


/* ==================================================
   CREATE THE WALL

   Exactly 67 image elements.

   First 64 occupy the 8 × 8 grid.
   The remaining 3 are initially hidden
   and later become heroes.
================================================== */

function createWall() {

  wall.innerHTML = "";

  tiles = [];

  files.forEach((file, index) => {

    const tile =
      document.createElement("div");

    tile.className = "tile";

    /*
      Images 1–64 are the quiet underlying wall.

      Images 65–67 are reserved as possible
      hero images.

      They are still part of the same 67-image
      collection.
    */

    if (index >= 64) {

      tile.style.display = "none";

    }


    const img =
      document.createElement("img");

    img.src = file;

    img.alt =
      `Ukraine at war — image ${index + 1}`;

    img.decoding = "async";

    img.loading =
      index < 20
        ? "eager"
        : "lazy";


    /*
      If a file cannot be found, hide it.
      Never substitute anything.
    */

    img.addEventListener(
      "error",
      () => {

        tile.style.display = "none";

      }
    );


    tile.appendChild(img);

    wall.appendChild(tile);

    tiles.push(tile);

  });


  /*
    Fade in the first 64.
  */

  requestAnimationFrame(() => {

    tiles
      .slice(0, 64)
      .forEach((tile, index) => {

        setTimeout(() => {

          tile.classList.add("visible");

        }, index * 22);

      });

  });


  updateCounter();

}


/* ==================================================
   BREATHING

   Very small movements.
   Almost subliminal.
================================================== */

function breathe() {

  if (paused) {
    return;
  }


  tiles
    .slice(0, 64)
    .forEach(tile => {

      if (
        tile.style.display === "none"
      ) {
        return;
      }


      const x =
        random(-1.5, 1.5);

      const y =
        random(-1.5, 1.5);

      const r =
        random(-0.18, 0.18);

      const s =
        random(.998, 1.002);


      tile.style.setProperty(
        "--x",
        `${x.toFixed(2)}px`
      );

      tile.style.setProperty(
        "--y",
        `${y.toFixed(2)}px`
      );

      tile.style.setProperty(
        "--r",
        `${r.toFixed(2)}deg`
      );

      tile.style.setProperty(
        "--s",
        s.toFixed(4)
      );

    });

}


/* ==================================================
   QUIET DISSOLVE

   We don't swap or invent images.

   We simply soften the entire wall briefly,
   then let it settle again.
================================================== */

function dissolveWall() {

  const base =
    tiles.slice(0, 64);


  base.forEach(tile => {

    if (
      tile.style.display === "none"
    ) {
      return;
    }

    tile.style.opacity = ".72";

  });


  setTimeout(() => {

    base.forEach(tile => {

      if (
        tile.style.display === "none"
      ) {
        return;
      }

      tile.style.opacity = "";

    });

  }, 1100);

}


/* ==================================================
   SHUFFLE

   The 64 underlying images change position
   without changing size.

   The images themselves remain exactly the
   same files.
================================================== */

function shuffleWall() {

  const base =
    tiles.slice(0, 64);

  const order =
    shuffle(base);


  order.forEach(tile => {

    wall.appendChild(tile);

  });


  /*
    Breathing continues after the shuffle.
  */

  breathe();

}


/* ==================================================
   HERO

   One of images 65, 66, 67 becomes a larger
   square.

   It is still exactly the same image file.
================================================== */

function showHero() {

  /*
    Remove any previous hero.
  */

  hideHero();


  /*
    Choose one of the three reserved images.
  */

  const candidates = [64, 65, 66];

  let chosen =
    candidates[
      Math.floor(
        Math.random() *
        candidates.length
      )
    ];


  /*
    Make sure we don't immediately repeat
    the same hero.
  */

  if (
    currentHero !== null &&
    candidates.length > 1
  ) {

    while (
      chosen === currentHero
    ) {

      chosen =
        candidates[
          Math.floor(
            Math.random() *
            candidates.length
          )
        ];

    }

  }


  currentHero = chosen;


  const source =
    tiles[chosen];


  const hero =
    document.createElement("div");

  hero.className = "hero";


  const img =
    document.createElement("img");

  /*
    THIS IS THE ORIGINAL FILE.
    No generated image.
    No duplicate asset.
    No alteration.
  */

  img.src =
    files[chosen];

  img.alt =
    `Ukraine at war — image ${chosen + 1}`;

  img.decoding = "async";


  hero.appendChild(img);

  document.body.appendChild(hero);


  /*
    Determine a square hero size based on
    the available wall.

    Desktop: approximately 2 regular tiles.
  */

  const viewportWidth =
    window.innerWidth;

  const viewportHeight =
    window.innerHeight;


  let size;

  if (viewportWidth > 700) {

    size =
      Math.min(
        viewportWidth * .24,
        viewportHeight * .40
      );

  }
  else {

    size =
      Math.min(
        viewportWidth * .42,
        viewportHeight * .30
      );

  }


  /*
    Keep the hero away from the masthead
    and footer.
  */

  const minTop =
    viewportWidth > 700
      ? 120
      : 85;

  const maxTop =
    viewportHeight -
    size -
    105;


  const x =
    random(
      24,
      viewportWidth -
      size -
      24
    );


  const y =
    random(
      minTop,
      Math.max(
        minTop,
        maxTop
      )
    );


  hero.style.setProperty(
    "--hero-size",
    `${size}px`
  );

  hero.style.setProperty(
    "--hero-x",
    `${x}px`
  );

  hero.style.setProperty(
    "--hero-y",
    `${y}px`
  );


  /*
    Fade in.
  */

  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      hero.classList.add("show");

    });

  });


  currentHero = chosen;

  currentHeroElement = hero;

  heroVisible = true;


  /*
    Let the hero breathe very slightly.
  */

  setTimeout(() => {

    if (
      heroVisible &&
      !paused
    ) {

      hero.style.transform =
        `translate3d(${x}px, ${y}px, 0) scale(1.012)`;

    }

  }, 2500);

}


/* ==================================================
   HERO STATE
================================================== */

let currentHeroElement = null;


function hideHero() {

  if (!currentHeroElement) {
    heroVisible = false;
    return;
  }


  const hero =
    currentHeroElement;


  heroVisible = false;


  hero.classList.remove("show");


  setTimeout(() => {

    if (
      hero.parentNode
    ) {

      hero.parentNode.removeChild(hero);

    }

  }, 2400);


  currentHeroElement = null;

}


/* ==================================================
   RECOMPOSE

   Slow, restrained sequence:

   1. shuffle the underlying 64
   2. breathe
   3. occasionally introduce a hero
   4. occasionally remove it
================================================== */

function recompose() {

  if (paused) {
    return;
  }


  composition++;


  shuffleWall();


  dissolveWall();


  /*
    Hero approximately every third
    composition.

    Then it disappears again later.

    This keeps it exceptional.
  */

  if (
    composition % 3 === 0 &&
    !heroVisible
  ) {

    setTimeout(
      showHero,
      1200
    );

  }


  else if (
    composition % 4 === 0 &&
    heroVisible
  ) {

    setTimeout(
      hideHero,
      800
    );

  }


  updateCounter();

}


/* ==================================================
   COUNTER
================================================== */

function updateCounter() {

  counter.textContent =
    String(
      (composition + 1) % 100
    ).padStart(2, "0");

}


/* ==================================================
   PAUSE
================================================== */

function togglePause() {

  paused = !paused;


  pauseButton.textContent =
    paused
      ? "Play"
      : "Pause";


  if (!paused) {

    breathe();

  }

}


/* ==================================================
   BUTTONS
================================================== */

recomposeButton.addEventListener(
  "click",
  () => {

    const wasPaused =
      paused;

    paused = false;

    recompose();

    paused =
      wasPaused;

    pauseButton.textContent =
      paused
        ? "Play"
        : "Pause";

  }
);


pauseButton.addEventListener(
  "click",
  togglePause
);


/* ==================================================
   VERY SLOW BREATHING
================================================== */

setInterval(
  () => {

    if (!paused) {
      breathe();
    }

  },
  7000
);


/* ==================================================
   SLOW RECOMPOSITION

   Every 18 seconds rather than constantly.
================================================== */

setInterval(
  () => {

    if (!paused) {
      recompose();
    }

  },
  18000
);


/* ==================================================
   START
================================================== */

createWall();

</script>

</body>
</html>
